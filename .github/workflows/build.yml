name: Build NexusPro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure asset folders
        run: mkdir -p assets/icons assets/images

      - name: Setup signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-key.jks
            {
              echo "storeFile=upload-key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          fi

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "NexusPro-1.7.0-${f#app-}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: NexusPro-APK
          path: build/app/outputs/flutter-apk/NexusPro-*.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NexusPro build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/NexusPro-*.apk
