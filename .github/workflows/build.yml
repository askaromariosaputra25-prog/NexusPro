name: Build NexusPro APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          unzip -q NexusPro.zip
          cd NexusPro
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NexusPro-debug-apk
          path: NexusPro/app/build/outputs/apk/debug/app-debug.apk
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            NexusPro/app/build/outputs/apk/debug/app-debug.apk \
            --title "NexusPro v${{ github.run_number }}" \
            --notes "Build otomatis - NexusPro Game Booster"
